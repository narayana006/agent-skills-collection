name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint skills and run tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Validate every skill (warnings fail the build)
        run: skill-lint skills --strict
      - name: Run tests
        run: python -m pytest -v
