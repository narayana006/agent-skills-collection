[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skills-collection"
version = "0.1.0"
description = "Reusable agent skills (SKILL.md folders) and skill-lint, a validator for them"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Narayana Vemburaj" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
skill-lint = "skill_lint.cli:main"

[tool.setuptools]
packages = ["skill_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
